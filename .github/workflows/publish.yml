name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node.js 22 for registry.npmjs.org
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Verify release tag matches package.json version
        env:
          EXPECTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/verify-release-tag.mjs "$EXPECTED_TAG"

      - name: Install, verify, and build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish belive-aihub with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
